<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tilausvahvistus</title>
<style>
  /* Kliini ja yksinkertainen: valkoinen lomake vasemmalla, A4-dokumentti oikealla, yksi aksentti. */
  :root{--ink:#14130f;--muted:#6f6c64;--line:#e6e3dc;--bg:#f3f2ee;--accent:#ff4d1a;--focus:#14130f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:400px 1fr;min-height:100vh}
  @media (max-width:980px){.app{grid-template-columns:1fr}}

  /* Lomake */
  .form{background:#fff;border-right:1px solid var(--line);padding:28px 28px 40px;display:flex;flex-direction:column;gap:28px}
  .form h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
  .sec h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  .grid .full{grid-column:1/-1}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  label small{font-weight:400;color:var(--accent)}
  input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:38px}
  textarea{resize:vertical;line-height:1.4}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
  input::placeholder,textarea::placeholder{color:#b5b1a7}
  .price{position:relative}
  .price input{padding-right:40px;text-align:left;font-variant-numeric:tabular-nums}
  .price.kk input{padding-right:64px}
  .price span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
  .row-name{display:flex;align-items:center;min-height:38px;font-size:13px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
  button{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 18px;cursor:pointer}
  button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  button.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  button.ghost{border-color:transparent;color:var(--muted)}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  details.sender{border-top:1px solid var(--line);padding-top:16px}
  details.sender summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none}
  details.sender summary::-webkit-details-marker{display:none}
  details.sender .grid{margin-top:12px}
  .hint{font-size:12px;color:var(--muted);margin:6px 0 0}

  /* Dokumentti */
  .stage{padding:32px 24px 60px;overflow:auto}
  .doc{width:210mm;min-height:297mm;margin:0 auto;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 36px rgba(20,19,15,.10);padding:18mm 18mm 16mm;display:flex;flex-direction:column;font-size:10pt;line-height:1.45}
  @media (max-width:980px){.doc{width:100%;min-height:0;padding:24px}}
  .d-head{display:flex;justify-content:space-between;align-items:flex-start}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:36px;height:36px}
  .brand b{font-size:15pt;font-weight:800;letter-spacing:.01em}
  .brand b small{display:block;font-size:6.5pt;font-weight:500;letter-spacing:.4em;margin-top:2px}
  .d-title{text-align:right}
  .d-title h1{font-size:20pt;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
  .meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;justify-content:end;font-size:9pt;margin:0}
  .meta dt{color:var(--muted)}
  .meta dd{margin:0;font-weight:600;text-align:right}
  .bar{height:3px;background:var(--ink);margin:16px 0 20px;position:relative}
  .bar::after{content:"";position:absolute;left:0;top:0;width:40px;height:3px;background:var(--accent)}
  .parties{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:22px}
  h3.k{font-size:7.5pt;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 6px}
  .party p{margin:0;white-space:pre-line}
  .party .name{font-weight:600;font-size:11pt}
  table.items{width:100%;border-collapse:collapse;font-size:9.5pt}
  .items th{font-size:7.5pt;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:0 6px 6px;border-bottom:1.5px solid var(--ink)}
  .items td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .items .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .items .desc{color:var(--muted);font-size:8.5pt;margin-top:2px}
  .totals{display:flex;justify-content:flex-end;gap:28px;margin:10px 0 24px;flex-wrap:wrap}
  .tot{min-width:220px;font-size:9.5pt}
  .tot .l{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
  .tot .l.sum{border-top:1.5px solid var(--ink);margin-top:4px;padding-top:6px;font-weight:700;font-size:10.5pt}
  .d-sec{margin-bottom:16px;break-inside:avoid}
  .terms{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:9.5pt;margin:0}
  .terms dt{color:var(--muted)}
  .terms dd{margin:0}
  .d-sec p{margin:0;white-space:pre-line}
  .d-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 16px;font-size:8pt;color:var(--muted)}
  .d-foot b{color:var(--ink);font-weight:600}
  .empty{color:#b5b1a7}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%)}

  @media print{
    @page{size:A4;margin:0}
    body{background:#fff}
    .app{display:block}
    .form,.toast{display:none!important}
    .stage{padding:0;overflow:visible}
    .doc{box-shadow:none;margin:0;width:210mm;min-height:297mm}
  }
</style>
</head>
<body>
<div class="app">

<aside class="form">
  <h1>Tilausvahvistus</h1>

  <section class="sec">
    <h2>Asiakas</h2>
    <div class="grid">
      <div><label>Domain <small id="domState"></small></label><input data-k="o.domain" placeholder="esimerkki.fi" autocapitalize="none" spellcheck="false" id="domainIn" autofocus></div>
      <div><label>Yritys</label><input data-k="c.company" placeholder="Esimerkki Oy"></div>
      <div><label>Y-tunnus <small id="ytjState"></small></label><input data-k="c.ytunnus" placeholder="1234567-8" inputmode="numeric" autocomplete="off"></div>
      <div><label>Yhteyshenkilö</label><input data-k="c.contact" placeholder="Matti Meikäläinen"></div>
      <div><label>Sähköposti</label><input data-k="c.email" type="email" autocapitalize="none"></div>
      <div><label>Puhelin</label><input data-k="c.phone"></div>
      <div><label>Laskutusosoite</label><textarea data-k="c.address" rows="2" placeholder="Katuosoite&#10;00100 Kaupunki"></textarea></div>
    </div>
  </section>

  <section class="sec">
    <h2>Tilaus</h2>
    <div class="grid">
      <div><label>Myyjä</label>
        <select data-k="s.contact" id="myyja">
          <option>Ville Waara</option>
          <option>Sulo Mäki</option>
        </select>
      </div>
      <div><label>Aloituspalaveri</label><input data-k="o.kickoff" type="datetime-local"></div>
      <div><label><span id="siteName">Verkkosivusto</span>, alv 0 %</label><div class="price"><input data-k="p.site" inputmode="decimal" placeholder="0"><span>€</span></div></div>
      <div><label>Hosting ja ylläpito, alv 0 %</label><div class="price kk"><input data-k="p.hosting" inputmode="decimal" placeholder="0"><span>€ / kk</span></div></div>
    </div>
  </section>

  <section class="sec">
    <h2>Ehdot</h2>
    <div class="grid">
      <div><label>Laskutus</label>
        <select data-k="t.billing">
          <option value="kerralla">Verkkosivu kertamaksulla, hosting 3 kk välein</option>
          <option value="50">Verkkosivu kahdessa erässä 50 / 50, hosting 3 kk välein</option>
          <option value="33">Verkkosivu kolmessa erässä 33 / 33 / 33, hosting 3 kk välein</option>
          <option value="muu">Muu, kirjoita itse</option>
        </select></div>
      <div id="billingOtherWrap" hidden><input data-k="t.billingOther" placeholder="Laskutusehto omin sanoin"></div>
      <div><label>Maksuehto</label>
        <select data-k="t.payment">
          <option>7 vrk netto</option>
          <option>14 vrk netto</option>
          <option>3 vrk netto</option>
          <option>30 vrk netto</option>
        </select></div>
      <div><label>Lisätiedot</label><textarea data-k="t.notes" rows="3"></textarea></div>
    </div>
  </section>

  <div class="actions">
    <button class="accent" id="btnSend">Lähetä tilaus</button>
    <button class="ghost" id="btnClear">Tyhjennä</button>
  </div>

  <details class="sender">
    <summary>Lähettäjän tiedot</summary>
    <div class="grid">
      <div class="full"><label>Yritys</label><input data-k="s.company"></div>
      <div><label>Y-tunnus</label><input data-k="s.ytunnus"></div>
      <div><label>Myyjän sähköposti</label><input data-k="s.email"></div>
      <div><label>Puhelin</label><input data-k="s.phone"></div>
      <div class="full"><label>Osoite</label><textarea data-k="s.address" rows="2"></textarea></div>
      <div><label>Verkkosivu</label><input data-k="s.web"></div>
      <div><label>IBAN</label><input data-k="s.iban"></div>
    </div>
    <p class="hint">Säilyvät tällä koneella.</p>
  </details>
</aside>

<main class="stage"><article class="doc" id="doc"></article></main>
</div>
<div class="toast" id="toast"></div>

<!-- Netlify Forms tunnistaa lomakkeen tästä; lähetys tehdään JS:llä. Kenttien nimet pidetään ennallaan (putki lukee ne). -->
<form name="tilausvahvistus" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field">
  <textarea name="tilausnumero"></textarea><textarea name="paivays"></textarea><textarea name="viite"></textarea>
  <textarea name="asiakas"></textarea><textarea name="ytunnus"></textarea><textarea name="yhteyshenkilo"></textarea>
  <textarea name="sahkoposti"></textarea><textarea name="puhelin"></textarea><textarea name="laskutusosoite"></textarea>
  <textarea name="verkkolasku"></textarea><textarea name="tilausrivit"></textarea><textarea name="kertaluonteiset"></textarea>
  <textarea name="kuukausittain"></textarea><textarea name="laskutus"></textarea><textarea name="maksuehto"></textarea>
  <textarea name="lisatiedot"></textarea><textarea name="domain"></textarea><textarea name="aloituspalaveri"></textarea>
  <textarea name="alasivut"></textarea><textarea name="myyja"></textarea><textarea name="myyja_email"></textarea>
</form>

<script>
const MARK = '<svg viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#14130f"/><circle cx="14" cy="14" r="4" fill="#ff4d1a"/><circle cx="26" cy="14" r="4" fill="#ff4d1a"/><rect x="9" y="24" width="22" height="5" rx="2.5" fill="#f4f1ea"/></svg>';
const VAT = 25.5;
const MYYJAT = {"Ville Waara":"ville@aijagroup.fi", "Sulo Mäki":"sulo@aijagroup.fi"};
const SENDER_DEFAULT = {company:"Äijä Group Oy", ytunnus:"3412426-3", contact:"Ville Waara", email:"ville@aijagroup.fi", phone:"", address:"Sysimiiluntie 15 B 4\n33870 Tampere", web:"aijagroup.fi", iban:""};
const BILLING = {
  kerralla:"Verkkosivu kertamaksulla, hosting 3 kk välein.",
  "50":"Verkkosivu kahdessa erässä (50 % / 50 %), hosting 3 kk välein.",
  "33":"Verkkosivu kolmessa erässä (33 % / 33 % / 33 %), hosting 3 kk välein.",
};
const DEFAULT_NOTES = "Laskutus aloituspalaverin jälkeen. Sivuston julkaisu tarvittavien vedoskierrosten ja siirtotietojen vastaanottamisen jälkeen.";

// ---------- tila ----------
const today = () => new Date().toISOString().slice(0,10);
function nextNumber(){ let n=1; try{ n=parseInt(localStorage.getItem("ag_tv_seq")||"0",10)+1 }catch(e){} return "#"+n }
function bumpSeq(){ try{ const m=(state.o.number||"").match(/(\d+)$/); if(m){ const cur=parseInt(localStorage.getItem("ag_tv_seq")||"0",10); localStorage.setItem("ag_tv_seq", Math.max(cur, parseInt(m[1],10))) } }catch(e){} }
function loadSender(){ try{ const s=JSON.parse(localStorage.getItem("ag_tv_sender")||"null"); if(s) return {...SENDER_DEFAULT,...s} }catch(e){} return {...SENDER_DEFAULT} }
function blankOrder(sender){
  return { v:3, s: sender||{...SENDER_DEFAULT},
    c:{company:"",ytunnus:"",contact:"",email:"",phone:"",address:""},
    o:{number:nextNumber(), date:today(), domain:"", kickoff:""},
    p:{site:"", hosting:""},
    t:{billing:"kerralla", billingOther:"", payment:"7 vrk netto", notes:DEFAULT_NOTES} };
}
let state=null;
try{ state=JSON.parse(localStorage.getItem("ag_tv_current")||"null") }catch(e){}
if(!state || state.v!==3){
  // vanha versio: säilytetään vain numero ja lähettäjä
  const old=state; state=blankOrder(loadSender());
  if(old?.o?.number) state.o.number=old.o.number;
}
if(!state.t.notes) state.t.notes=DEFAULT_NOTES;
state.o.date=today();   // päiväys on aina kuluva päivä

// ---------- apurit ----------
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n=parseFloat(String(v).replace(/\s/g,"").replace(",",".")); return isFinite(n)?n:0 };
const eur = n => n.toLocaleString("fi-FI",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const fiDate = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${+d}.${+m}.${y}` };
const WD=["su","ma","ti","ke","to","pe","la"];
const fiDateTime = v => { if(!v) return ""; const d=new Date(v); if(isNaN(d)) return v; return `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()} klo ${String(d.getHours()).padStart(2,"0")}.${String(d.getMinutes()).padStart(2,"0")}` };
const cleanDomain = d => String(d||"").trim().toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/.*$/,"");
const get = p => p.split(".").reduce((o,k)=>o?.[k], state);
const set = (p,v) => { const ks=p.split("."); let o=state; ks.slice(0,-1).forEach(k=>o=o[k]); o[ks.at(-1)]=v };
const E = (v,ph) => v ? esc(v) : `<span class="empty">${esc(ph)}</span>`;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200) }
function save(){ try{ localStorage.setItem("ag_tv_current", JSON.stringify(state)); localStorage.setItem("ag_tv_sender", JSON.stringify(state.s)) }catch(e){} }
function billingText(){ return state.t.billing==="muu" ? (state.t.billingOther||"") : BILLING[state.t.billing]||BILLING.kerralla }

function calc(){
  const site=num(state.p.site), host=num(state.p.hosting), v=VAT/100, r=x=>Math.round(x*100)/100;
  return { site:{net:site, vat:r(site*v), gross:r(site*(1+v))}, host:{net:host, vat:r(host*v), gross:r(host*(1+v)), q:r(host*3), qGross:r(host*3*(1+v))} };
}

// ---------- dokumentti ----------
function renderDoc(){
  const {c,o,s,t}=state, k=calc(), domain=cleanDomain(o.domain);
  const cust=[c.contact, c.address, c.ytunnus&&"Y-tunnus "+c.ytunnus, c.email, c.phone].filter(Boolean).map(esc).join("\n");
  const send=[s.contact, s.address, s.email, s.phone].filter(Boolean).map(esc).join("\n");
  const [w1,w2]=(s.company||"").replace(/\s+Oy$/i,"").toUpperCase().split(/\s+(.+)/);
  const rows=[];
  rows.push(`<tr><td><div>Verkkosivusto${domain?" – "+esc(domain):""}</div><div class="desc">Sivuston uudistus ja asennus NordicHostiin</div></td><td class="num">1 kpl</td><td class="num">${eur(k.site.net)}</td><td class="num">${eur(k.site.net)}</td></tr>`);
  rows.push(`<tr><td><div>Hosting ja ylläpito</div><div class="desc">NordicHost, laskutetaan 3 kk välein</div></td><td class="num">1 kk</td><td class="num">${eur(k.host.net)}</td><td class="num">${eur(k.host.net)} / kk</td></tr>`);
  $("#doc").innerHTML=`
    <div class="d-head">
      <div class="brand">${MARK}<b>${esc(w1||"")}<small>${esc(w2||"")}</small></b></div>
      <div class="d-title"><h1>Tilausvahvistus</h1>
        <dl class="meta"><dt>Numero</dt><dd>${E(o.number,"—")}</dd><dt>Päiväys</dt><dd>${E(fiDate(o.date),"—")}</dd>${domain?`<dt>Sivusto</dt><dd>${esc(domain)}</dd>`:""}${o.kickoff?`<dt>Aloituspalaveri</dt><dd>${esc(fiDateTime(o.kickoff))}</dd>`:""}</dl></div>
    </div>
    <div class="bar"></div>
    <div class="parties">
      <div class="party"><h3 class="k">Tilaaja</h3><p class="name">${E(c.company,"Yritys")}</p><p>${cust}</p></div>
      <div class="party"><h3 class="k">Toimittaja</h3><p class="name">${esc(s.company)}</p><p>${send}</p></div>
    </div>
    <table class="items"><thead><tr><th>Tuote / palvelu</th><th class="num">Määrä</th><th class="num">À-hinta alv 0 %</th><th class="num">Yhteensä alv 0 %</th></tr></thead><tbody>${rows.join("")}</tbody></table>
    <div class="totals">
      <div class="tot"><h3 class="k">Kertamaksu</h3><div class="l"><span>Alv 0 %</span><span>${eur(k.site.net)}</span></div><div class="l"><span>Alv ${VAT.toLocaleString("fi-FI")} %</span><span>${eur(k.site.vat)}</span></div><div class="l sum"><span>Yhteensä</span><span>${eur(k.site.gross)}</span></div></div>
      <div class="tot"><h3 class="k">Hosting ja ylläpito</h3><div class="l"><span>Alv 0 % / kk</span><span>${eur(k.host.net)}</span></div><div class="l"><span>Sis. alv / kk</span><span>${eur(k.host.gross)}</span></div><div class="l sum"><span>Lasku 3 kk välein</span><span>${eur(k.host.qGross)}</span></div></div>
    </div>
    <div class="d-sec"><h3 class="k">Ehdot</h3><dl class="terms"><dt>Laskutus</dt><dd>${E(billingText(),"—")}</dd><dt>Maksuehto</dt><dd>${esc(t.payment)}</dd></dl></div>
    ${t.notes?`<div class="d-sec"><h3 class="k">Lisätiedot</h3><p>${esc(t.notes)}</p></div>`:""}
    <footer class="d-foot"><b>${esc(s.company)}</b>${s.ytunnus?`<span>Y-tunnus ${esc(s.ytunnus)}</span>`:""}${s.web?`<span>${esc(s.web)}</span>`:""}${s.email?`<span>${esc(s.email)}</span>`:""}${s.phone?`<span>${esc(s.phone)}</span>`:""}${s.iban?`<span>IBAN ${esc(s.iban)}</span>`:""}</footer>`;
  $("#siteName").textContent="Verkkosivusto"+(domain?" – "+domain:"");
  $("#billingOtherWrap").hidden = state.t.billing!=="muu";
  document.title=["Tilausvahvistus",o.number,c.company].filter(Boolean).join(" ");
}
function update(){ renderDoc(); save() }

// ---------- kentät ----------
function bindFields(){
  document.querySelectorAll("[data-k]").forEach(el=>{
    el.value = get(el.dataset.k) ?? "";
    el.oninput = el.onchange = ()=>{ set(el.dataset.k, el.value); update() };
  });
  // Myyjä-valinta asettaa myös sähköpostin
  const my=$("#myyja"); if(my){ if(!MYYJAT[state.s.contact]) { state.s.contact="Ville Waara"; my.value=state.s.contact }
    my.addEventListener("change", ()=>{ state.s.email=MYYJAT[my.value]||state.s.email; const e=document.querySelector('[data-k="s.email"]'); if(e) e.value=state.s.email; update() }); }
}

// ---------- napit ----------
let printing=false;
// PDF: lähetyksen jälkeen avataan tulostus/Tallenna PDF; sama PDF lähtee myös liitteenä myyjän ilmoitusviestissä.
window.addEventListener("afterprint",()=>{
  if(!printing) return; printing=false;
  const m=(state.o.number||"").match(/^(.*?)(\d+)$/);
  state.o.number = m ? m[1]+String(parseInt(m[2],10)+1).padStart(m[2].length,"0") : nextNumber();
  update(); toast("Seuraava tilausnumero: "+state.o.number);
});

function sendFields(){
  const {c,o,s,t}=state, k=calc(), domain=cleanDomain(o.domain), vat=VAT.toLocaleString("fi-FI");
  const rows=[`Verkkosivusto – ${domain||"domain"}: 1 kpl × ${eur(k.site.net)} = ${eur(k.site.net)} alv 0 %`,
              `Hosting ja ylläpito: 1 kk × ${eur(k.host.net)} = ${eur(k.host.net)} alv 0 % / kk`].join("\n");
  return {
    tilausnumero:o.number, paivays:fiDate(o.date), viite:"",
    asiakas:c.company, ytunnus:c.ytunnus, yhteyshenkilo:c.contact, sahkoposti:c.email, puhelin:c.phone,
    laskutusosoite:c.address, verkkolasku:"", tilausrivit:rows,
    kertaluonteiset:`${eur(k.site.net)} alv 0 % + alv ${vat} % ${eur(k.site.vat)} = ${eur(k.site.gross)}`,
    kuukausittain:`${eur(k.host.net)} alv 0 % + alv ${vat} % ${eur(k.host.vat)} = ${eur(k.host.gross)} / kk`,
    laskutus:billingText(), maksuehto:t.payment, lisatiedot:t.notes,
    domain, aloituspalaveri:o.kickoff, alasivut:"", myyja:s.contact, myyja_email:s.email
  };
}
let sending=false;
$("#btnSend").onclick=async()=>{
  if(sending) return;
  const miss=[];
  if(!state.c.company) miss.push("yritys"); if(!state.c.email) miss.push("sähköposti"); if(!cleanDomain(state.o.domain)) miss.push("domain");
  if(!state.o.kickoff) miss.push("aloituspalaverin aika"); if(!num(state.p.site)) miss.push("verkkosivuston hinta");
  if(miss.length){ toast("Puuttuu: "+miss.join(", ")); return }
  if(!confirm(`Lähetetäänkö tilaus (${state.c.company})? Asiakkaalle lähtee viesti ja kalenterikutsu, tilaus menee CRM:ään.`)) return;
  sending=true; const b=$("#btnSend"); b.textContent="Lähetetään…"; b.disabled=true;
  try{
    const f=sendFields();
    // 1) Fluid CRM suoraan (Netlify-funktio, avain palvelimella)
    const r=await fetch("/.netlify/functions/vie-crm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(f)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok) throw new Error(j.error||("HTTP "+r.status));
    // 2) Netlify Forms (sähköposti-ilmoitus + putken webhook: Drive, kalenteri, taulukko)
    const body=new URLSearchParams({"form-name":"tilausvahvistus","bot-field":"",...f});
    await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()}).catch(()=>{});
    bumpSeq(); toast(j.updated ? "Tilaus päivitetty ✓" : "Tilaus lähetetty ✓ · tallenna PDF");
    setTimeout(()=>window.print(),600);   // Tallenna PDF -ikkuna myyjälle (Visma Signia varten)
    const m=(state.o.number||"").match(/^(.*?)(\d+)$/);   // seuraava tilausnumero valmiiksi
    state.o.number = m ? m[1]+String(parseInt(m[2],10)+1).padStart(m[2].length,"0") : nextNumber(); save();
  }catch(e){ toast("Vienti epäonnistui: "+e.message) }
  finally{ sending=false; b.textContent="Lähetä tilaus"; b.disabled=false }
};
$("#btnClear").onclick=()=>{
  if(!confirm("Tyhjennetäänkö asiakkaan ja tilauksen tiedot?")) return;
  const keep={s:state.s, number:state.o.number};
  state=blankOrder(keep.s); state.o.number=keep.number;
  bindFields(); update(); window.scrollTo(0,0); toast("Tyhjennetty");
};

// Esitäyttö linkistä (Fluidin Tilausvahvistus-linkki): ?yritys=&ytunnus=&nimi=&email=&puhelin=&osoite=&domain=
(function(){
  const q=new URLSearchParams(location.search); if(![...q.keys()].length) return;
  const map={yritys:"c.company",ytunnus:"c.ytunnus",nimi:"c.contact",email:"c.email",puhelin:"c.phone",osoite:"c.address",domain:"o.domain"};
  let n=0; for(const k in map){ const v=q.get(k); if(v){ set(map[k], k==="domain"?cleanDomain(v):v); n++ } }
  if(n){ history.replaceState(null,"",location.pathname); setTimeout(()=>toast("Asiakkaan tiedot esitäytetty linkistä"),300) }
})();

// ---------- YTJ-haku (PRH:n avoin rajapinta, sama data kuin Netvisorissa) ----------
// Kun Y-tunnus on muotoa 1234567-8, haetaan nimi ja postiosoite ja täytetään tyhjät kentät.
let ytjLast="";
async function ytjLookup(){
  const raw=(ytjEl.value||"").trim().replace(/\s/g,""), id=/^\d{7}-?\d$/.test(raw) ? raw.replace(/^(\d{7})(\d)$/,"$1-$2") : "";
  const st=$("#ytjState");
  if(!id || id===ytjLast) return;
  ytjLast=id; st.textContent="haetaan…";
  try{
    const r=await fetch("https://avoindata.prh.fi/opendata-ytj-api/v3/companies?businessId="+encodeURIComponent(id));
    const d=await r.json(); const c=(d.companies||[])[0];
    if(!c){ st.textContent="ei löydy YTJ:stä"; return }
    const name=(c.names||[]).find(n=>!n.endDate && n.type==="1")?.name || (c.names||[]).find(n=>!n.endDate)?.name || "";
    const addr=(c.addresses||[]).find(a=>a.type===2) || (c.addresses||[])[0];
    let line="";
    if(addr){
      const street=[addr.street, addr.buildingNumber, addr.entrance, addr.apartmentNumber].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
      const box=addr.postOfficeBox ? "PL "+addr.postOfficeBox : "";
      const city=(addr.postOffices||[]).find(p=>p.languageCode==="1")?.city || (addr.postOffices||[])[0]?.city || "";
      const cityCase=city ? city.charAt(0)+city.slice(1).toLowerCase() : "";
      line=[addr.co?"c/o "+addr.co:"", street||box, [addr.postCode, cityCase].filter(Boolean).join(" ")].filter(Boolean).join("\n");
    }
    set("c.ytunnus", id);
    if(name && !state.c.company) set("c.company", name);
    if(line && !state.c.address) set("c.address", line);
    bindFields(); update(); st.textContent=name ? "YTJ ✓" : ""; toast(name ? "Haettu YTJ:stä: "+name : "Y-tunnus löytyi, nimi puuttuu");
  }catch(e){ st.textContent="haku ei onnistunut" }
}
const ytjEl=document.querySelector('[data-k="c.ytunnus"]');
ytjEl.addEventListener("input", ()=>{ $("#ytjState").textContent=""; ytjLast=""; if(/^\d{7}-?\d$/.test(ytjEl.value.trim())) ytjLookup() });

// ---------- esitäyttö domainista (sivu + YTJ) ----------
let domLast="", domTimer=null;
const domEl=$("#domainIn");
async function domainLookup(){
  const d=cleanDomain(domEl.value); const st=$("#domState");
  if(!/^[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}$/.test(d) || d===domLast) return;
  domLast=d; st.textContent="haetaan…";
  try{
    const r=await fetch("/.netlify/functions/esitaytto?domain="+encodeURIComponent(d));
    const j=await r.json();
    if(!j.ok){ st.textContent=""; return }
    const filled=[];
    if(j.ytunnus && !state.c.ytunnus){ set("c.ytunnus", j.ytunnus); filled.push("Y-tunnus") }
    if(j.company && !state.c.company){ set("c.company", j.company); filled.push("yritys") }
    if(j.address && !state.c.address){ set("c.address", j.address); filled.push("osoite") }
    if(j.emails?.[0] && !state.c.email){ set("c.email", j.emails[0]); filled.push("sähköposti") }
    if(j.phones?.[0] && !state.c.phone){ set("c.phone", j.phones[0]); filled.push("puhelin") }
    bindFields(); update(); ytjLast=state.c.ytunnus||"";
    if(filled.length){ st.textContent=(j.lahde||"haettu")+" ✓"; toast("Esitäytetty: "+filled.join(", ")+". Tarkista sähköposti ja yhteyshenkilö.") }
    else st.textContent=j.sivuLoytyi ? "ei löytynyt tietoja" : "sivu ei vastaa";
  }catch(e){ st.textContent="" }
}
domEl.addEventListener("input", ()=>{ clearTimeout(domTimer); domTimer=setTimeout(domainLookup, 700) });
domEl.addEventListener("blur", domainLookup);
ytjEl.addEventListener("blur", ytjLookup);

bindFields(); renderDoc();
</script>
