<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Siirtotiedot – Äijä Group</title>
<style>
  :root{--ink:#14130f;--muted:#6b6962;--line:#e4e1d8;--bg:#f7f5ef;--accent:#ff4d1a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  main{max-width:720px;margin:0 auto;padding:40px 16px 80px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  header svg{width:36px;height:36px}
  h1{font-size:28px;margin:0 0 8px}
  .lead{color:var(--muted);margin:0 0 28px}
  form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}
  fieldset{border:0;padding:0;margin:0 0 28px}
  legend{font-weight:600;font-size:17px;margin-bottom:4px}
  .hint{color:var(--muted);font-size:14px;margin:0 0 14px}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  label small{font-weight:400;color:var(--muted)}
  input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media (max-width:560px){.row{grid-template-columns:1fr}}
  button{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 28px;cursor:pointer}
  .note{background:var(--bg);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--muted);margin-top:8px}
  .hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#14130f"/><circle cx="14" cy="14" r="4" fill="#ff4d1a"/><circle cx="26" cy="14" r="4" fill="#ff4d1a"/><rect x="9" y="24" width="22" height="5" rx="2.5" fill="#f4f1ea"/></svg>
    <b>Äijä Group</b>
  </header>
  <h1>Siirtotiedot uutta sivustoa varten</h1>
  <p class="lead">Kolme kysymystä, jotta uusi sivu saadaan omaan osoitteeseenne ja sähköposti toimii koko ajan. Vastaa sen verran kuin tiedät. <b>Älä kirjoita salasanoja tähän.</b></p>

  <form name="siirtotiedot" method="POST" action="/siirtotiedot/kiitos.html" data-netlify="true" netlify-honeypot="bot-field" id="f">
    <input type="hidden" name="form-name" value="siirtotiedot">
    <p class="hp"><label>Älä täytä: <input name="bot-field"></label></p>

    <fieldset>
      <div class="row">
        <div><label>Yritys</label><input name="yritys" required></div>
        <div><label>Verkko-osoite</label><input name="domain" required autocapitalize="none"></div>
        <div><label>Yhteyshenkilö</label><input name="yhteyshenkilo" required></div>
        <div><label>Sähköposti</label><input name="sahkoposti" type="email" required></div>
      </div>
    </fieldset>

    <fieldset>
      <label>Missä verkko-osoite ja nykyinen sivu ovat nyt? <small>esim. Zoner, Hostingpalvelu, Fonecta, Wix, en tiedä</small></label>
      <input name="valittaja">

      <label>Missä yrityksen sähköposti on?</label>
      <select name="posti">
        <option value="">Valitse</option>
        <option>Samassa webhotellissa kuin nykyinen sivu</option>
        <option>Google Workspace (Gmail)</option>
        <option>Microsoft 365 (Outlook)</option>
        <option>Osoitteella ei ole sähköpostia (käytämme esim. gmail.com)</option>
        <option>En tiedä</option>
      </select>

      <label>Välittäjänvaihtoavain <small>osoitteen siirtoon, syötetään NordicHostin tilauksessa</small></label>
      <select name="avain">
        <option value="">Valitse</option>
        <option>Haen avaimen itse</option>
        <option>Tarvitsen apua avaimen hakemiseen</option>
        <option>En tiedä mikä se on</option>
      </select>

      <label>Uuden sivun yhteydenotot osoitteeseen</label>
      <input name="lomake_email" type="email">

      <label>Muuta <small>kysymyksiä, toiveita, aikataulu</small></label>
      <textarea name="lisatiedot" rows="3"></textarea>
    </fieldset>

    <button type="submit" id="send">Lähetä tiedot</button>
    <p class="note" id="err" hidden></p>
  </form>
</main>
<script>
  // Lähetys: 1) Fluid-merkintä (funktio), 2) Netlify Forms (ilmoitus + putki), 3) kiitos-sivu
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target, btn = document.getElementById('send'), err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Lähetetään…'; err.hidden = true;
    const data = Object.fromEntries(new FormData(form).entries());
    try {
      const r = await fetch('/.netlify/functions/siirtotiedot', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok && r.status !== 404) throw new Error(j.error || ('HTTP ' + r.status));   // 404 = diiliä ei löydy: tiedot menevät silti perille lomakkeena
    } catch (ex) { console.warn('Fluid:', ex.message); }
    try {
      await fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(data).toString() });
      location.href = '/siirtotiedot/kiitos.html';
    } catch (ex) {
      err.textContent = 'Lähetys ei onnistunut. Yritä uudelleen tai lähetä tiedot sähköpostilla osoitteeseen sulo@aijagroup.fi.'; err.hidden = false;
      btn.disabled = false; btn.textContent = 'Lähetä tiedot';
    }
  });
  // Esitäyttö linkistä: ?domain=&yritys=&email=&nimi=
  const q = new URLSearchParams(location.search);
  const pre = {domain:'domain', yritys:'yritys', email:'sahkoposti', nimi:'yhteyshenkilo'};
  for (const k in pre) { const v = q.get(k); if (v) { const el = document.querySelector(`[name="${pre[k]}"]`); if (el && !el.value) el.value = v; } }
</script>
</body>
</html>
